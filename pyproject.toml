[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "cscpi"
version = "0.1.0"
description = "Canada Supply Chain Pressure Index: a monthly, open-data composite of Canadian supply chain pressure, in the spirit of the New York Fed GSCPI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sachet Mulimani", email = "sachetmulimani@gmail.com" }]
keywords = ["canada supply chain pressure index", "supply chain", "gscpi", "statistics canada", "nowcasting", "pca", "economics"]
dependencies = ["polars>=1.0", "numpy>=1.24", "pyyaml>=6", "requests>=2.31"]

[project.optional-dependencies]
charts = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.5", "matplotlib>=3.8"]

[project.scripts]
cscpi = "cscpi.cli:main"

[project.urls]
Homepage = "https://github.com/msachet5/canada-supply-chain-pressure-index"
Data = "https://github.com/msachet5/canada-supply-chain-pressure-index/tree/main/data"

[tool.hatch.build.targets.wheel]
packages = ["src/cscpi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
